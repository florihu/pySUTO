name: pysuto_mine_to_refine
version: 0.1.0
description: prototype for pysuto
scope: mine_to_refine
temporal: (1990, 2022)

pipeline:
  acc_id: copper
  feeds: [baci, crude_ore, icsg]
  imputation:
    bindings:
      - {params_id: eff,       builder: ParametricImputer}
      - {params_id: ore_grade, builder: ParametricImputer}
      - {params_id: conc,      builder: ParametricImputer}
  constraints:
    bindings:
      - {params_id: conc,         builder: RatioConstraintBuilder}
      - {params_id: eff,          builder: RatioConstraintBuilder}
      - {params_id: conc,         builder: RatioBoundBuilder}
      - {params_id: eff,          builder: RatioBoundBuilder}
      - {params_id: stock_bounds, builder: RatioBoundBuilder}

propagation:
  p:         1.3      # Lp/power-mean exponent (Stages 1/2/3)
  q:         3.0      # ParametricImputer backward-branch knee sharpness
  alpha_min: 0.05     # ParametricImputer inverse-multiplier effective-sensitivity floor

imputers:
  flat_prior:
    default_cv: 0.3   # CV for edges matching no listed mask
    cv_lo_supply: 0.04 
    cv_hi_supply: 0.3
    cv_lo_use: 0.2
    cv_hi_use: 0.5
    row_inflation: 1.5

  time:
    window:           3
    min_obs:          2
    gap_inflation:    1.05
    method:           linear
    interpolate_only: true

constraints:
  sigma_a_cv_min:    0.05
  sigma_a_abs_floor: 1.0e-6
  sigma_c_cv_min:    0.05
  sigma_c_abs_floor: 1.0e-3