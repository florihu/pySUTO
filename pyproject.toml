[build-system]
requires = ["hatchling>=1.27", "hatch-vcs"]      # 1.27: PEP 639 licence fields
build-backend = "hatchling.build"

[project]
name = "pysuto"
dynamic = ["version"]
description = "Python-based Supply-Use Table Optimiser: sigma-weighted reconciliation of supply-use tables from conflicting sources"
readme = "README_PYPI.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Florian Huber", email = "florian.huber1@wu.ac.at" }]
keywords = [
    "material flow analysis",
    "supply-use tables",
    "data reconciliation",
    "uncertainty",
    "copper",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.26.4",
    "pandas>=2.3.3,<3",         # pandas 3 breaks the ICSG parser and acc I/O (#199)
    "scipy>=1.13.1",
    "pyarrow>=21.0.0",
    "clarabel>=0.11.1",
    "pyyaml>=6.0.3",
    "matplotlib>=3.9.2",
    "openpyxl>=3.1.5",          # pd.read_excel: acc, meta, feed diag, feed builders
]

[project.urls]
Homepage = "https://github.com/florihu/pySUTO"
Repository = "https://github.com/florihu/pySUTO"
Issues = "https://github.com/florihu/pySUTO/issues"

[project.optional-dependencies]
# Plotly Sankeys (psut.sankey); kaleido writes them to PNG.
sankey = ["plotly>=6.3.0", "kaleido>=1.4.0"]
tutorial = ["jupyter", "plotly>=6.3.0", "kaleido>=1.4.0"]
# sparse (pydata) and plotly: tests build a COO fixture and import scripts/report/*.
dev = ["pytest", "sparse", "plotly>=6.3.0", "coverage", "vulture", "nbclient", "ruff",
       "build", "twine"]

[project.scripts]
pysuto = "pysuto.__main__:main"

[tool.hatch.version]
source = "vcs"
# `git archive` output has no .git: .git_archival.txt (export-subst) carries the tag;
# the fallback covers an archive of an untagged commit.
raw-options = { fallback_version = "0.0.0+unknown" }

[tool.hatch.build.targets.wheel]
packages = ["src/pysuto"]
# The tutorial notebooks and their README ship as package data (#188); what a chapter
# writes beside them never does.
exclude = ["src/pysuto/tutorial/runs", "**/.ipynb_checkpoints"]

[tool.hatch.build.targets.sdist]
# Project history and working material stay in the repository; tests/ ships, and so
# does tools/, which the shipped tests load.
exclude = [
    "/scripts/explo",
    "/docs/rep",
    "/figs",
    "/docs/history",
    "/CLAUDE.md",
    "/.claude",
    "/.scratch",
    "/.github",
]

[tool.ruff]
target-version = "py39"
extend-exclude = ["leg", "scripts/explo", "*.ipynb"]

[tool.ruff.lint]
# Pyflakes only: unused imports and variables, undefined names. No formatter, no E rules.
select = ["F"]

[tool.ruff.lint.per-file-ignores]
# The fixtures maps, mock_acc_struct and raw_use_only are imported from test_conc and used
# as test parameters: pytest's idiom, which pyflakes reads as a redefinition. So are the
# fixtures the split-out application tests import from their library test (#304).
"tests/copper/test_copper_feed.py" = ["F811"]
"tests/copper/test_psut_cli.py" = ["F811"]
"tests/copper/test_pipeline_sweep_driver.py" = ["F811"]
